name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-build:
        # Run CI when:
        # - push: normal commits
        # - pull_request: normal PRs
        if: >
            (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release')) ||
            github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run ESLint
              run: pnpm run lint

            - name: Check Prettier formatting
              run: pnpm run format:check

            - name: Run tests
              run: pnpm test

            - name: Build
              run: pnpm run vite:build

            - name: Verify bundle size
              run: |
                  limit=2097152
                  size=$(wc -c < "dist/Toolasha.user.js")
                  if [ "$size" -gt "$limit" ]; then
                    echo "❌ dist/Toolasha.user.js is over 2MB limit ($size bytes)"
                    exit 1
                  fi
                  echo "✅ dist/Toolasha.user.js is under 2MB ($size bytes)"
